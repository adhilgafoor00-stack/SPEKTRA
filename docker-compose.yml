# Put your key in a .env file next to this one (see .env.example), NOT in this file.
# Compose reads .env automatically and passes the values below through.
services:
  spektra:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - SPEKTRA_LLM=${SPEKTRA_LLM:-auto}
      - SPEKTRA_LLM_MODEL=${SPEKTRA_LLM_MODEL:-}
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
